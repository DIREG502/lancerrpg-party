name: Release

# On a published release: stamp the tag's version and download URL into module.json,
# build module.zip, and attach both to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify package (static checks + tests)
        run: |
          npm ci
          npm run verify

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not derive a version from tag '$TAG'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Write version and download URL into module.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip
        run: |
          jq --arg v "$VERSION" --arg d "$DOWNLOAD" '.version = $v | .download = $d' module.json > module.json.tmp
          mv module.json.tmp module.json
          jq empty module.json
          cat module.json

      - name: Build module.zip
        # templates/ and assets/ are required at runtime (sheet/sidebar templates, party icon).
        run: |
          zip -r module.zip module.json README.md LICENSE CHANGELOG.md scripts styles lang templates assets
          unzip -l module.zip

      - name: Attach module.json and module.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" module.json module.zip --clobber --repo "${{ github.repository }}"
